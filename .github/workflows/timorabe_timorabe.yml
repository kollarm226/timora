# Docs for the Azure Web Apps Deploy action: https://github.com/Azure/webapps-deploy
# More GitHub Actions for Azure: https://github.com/Azure/actions

name: Build and deploy ASP.Net Core app to Azure Web App - TimoraBE

on:
  push:
    branches:
      - TimoraBE
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read #This is required for actions/checkout

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up .NET Core SDK
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore Timora.sln

      # Build the project
      - name: Build with dotnet
        run: dotnet build --configuration Release

      # Publish the project
      - name: Publish API
        run: dotnet publish Timora.Api/Timora.Api.csproj -c Release -o "${{env.DOTNET_ROOT}}/myapp"

      # Upload artifact for deployment
      - name: Upload artifact for deployment
        uses: actions/upload-artifact@v4
        with:
          name: .net-app
          path: ${{env.DOTNET_ROOT}}/myapp

  test:
    runs-on: windows-latest
    needs: build
    permissions:
      contents: read

    steps:
      # Checkout the repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # Set up .NET Core SDK
      - name: Set up .NET Core
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.x'

      # Restore dependencies
      - name: Restore dependencies
        run: dotnet restore Timora.sln

      # Build the project (needed for tests)
      - name: Build with dotnet
        run: dotnet build --configuration Release --no-restore

      # Run unit tests with code coverage
      - name: Run unit tests with coverage
        id: test
        run: dotnet test Timora.Tests/Timora.Tests.csproj --no-build --configuration Release --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory ./TestResults
        continue-on-error: false

      # Install ReportGenerator
      - name: Install ReportGenerator
        if: always()
        run: dotnet tool install -g dotnet-reportgenerator-globaltool

      # Generate coverage report
      - name: Generate coverage report
        if: always()
        run: |
          $coverageFiles = Get-ChildItem -Path ./TestResults -Filter "coverage.cobertura.xml" -Recurse -ErrorAction SilentlyContinue
          if ($coverageFiles) {
            Write-Host "Found coverage files: $($coverageFiles.FullName -join ', ')"
            reportgenerator -reports:./TestResults/**/coverage.cobertura.xml -targetdir:./CoverageReport -reporttypes:"Html;Cobertura;MarkdownSummaryGithub"
          } else {
            Write-Host "No coverage files found. Skipping report generation."
            New-Item -ItemType Directory -Force -Path ./CoverageReport | Out-Null
            "# Coverage Report`n`nNo coverage data available. Tests may have failed or no coverage was collected." | Out-File -FilePath ./CoverageReport/SummaryGithub.md
          }

      # Upload coverage report as artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: ./CoverageReport
          if-no-files-found: ignore

      # Upload test results
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: test-results
          path: ./TestResults/**/*.trx
          if-no-files-found: ignore

      # Add coverage summary to job summary
      - name: Add coverage to summary
        if: always()
        run: |
          if (Test-Path "./CoverageReport/SummaryGithub.md") {
            Get-Content "./CoverageReport/SummaryGithub.md" >> $env:GITHUB_STEP_SUMMARY
          }

  deploy:
    runs-on: windows-latest
    needs: [build, test]
    permissions:
      id-token: write #This is required for requesting the JWT
      contents: read #This is required for actions/checkout

    steps:
      # Download artifacts
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: .net-app
      
      # Login to Azure using service principal
      - name: Login to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      # Deploy to Azure Web App
      - name: Deploy to Azure Web App
        id: deploy-to-webapp
        uses: azure/webapps-deploy@v3
        with:
          app-name: 'TimoraBE'
          slot-name: 'Production'
          package: .
